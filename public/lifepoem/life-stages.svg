<!--
  The seven life stages, in the order the app opens them: childhood (a paper
  boat), school, career, romance (two cups set down together), family,
  reflections (a lit lantern) and wishes (a paper plane).

  Two rules this file must keep:
    * No text of any kind. One file serves all four locales; the names beside it
      are translatable HTML in messages/<locale>.json under `stages.items`.
    * Only the site's own tokens, from app/globals.css: paper #fbf7ef as the
      ground, then tint #f0e4d2, rule #ede3d2, edge #d4c4b0, card #ffffff and
      brand #8b4513 for the line work. No other colour appears here.

  The road is a Catmull-Rom spline through the seven medallion centres, so
  moving a medallion means recomputing it rather than nudging the path.
-->
