name: web

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Locale parity
        run: npm run check:locales

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end suite
        run: npm run test:e2e
        env:
          # The suite boots the site with the recording mail transport, so no
          # real support email is ever sent from CI.
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
